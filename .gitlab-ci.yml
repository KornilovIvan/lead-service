test:
  image: golang:1.21
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_USER: leads
    POSTGRES_PASSWORD: leads
    POSTGRES_DB: leads_test
    TEST_DATABASE_URL: postgres://leads:leads@postgres:5432/leads_test?sslmode=disable
    REDIS_URL: redis://redis:6379/1
  before_script:
    - go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.16.2
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - |
      ok=0
      for i in $(seq 1 30); do
        if migrate -path=migrations -database "$TEST_DATABASE_URL" up; then
          ok=1
          break
        fi
        sleep 1
      done
      test "$ok" = "1"
  script:
    - go test ./...

lint:
  image: golangci/golangci-lint:v1.55.2
  script:
    - golangci-lint run
